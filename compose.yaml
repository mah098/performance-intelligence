services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: webvitals
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - webvitals-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webvitals"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  webvitals-postgres:
